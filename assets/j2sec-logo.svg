<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">J2SEC Logo</title>
  <desc id="desc">J2SEC monogram logo in black, gray, white and bright blue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="1" stop-color="#141a22"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38c7ff"/>
      <stop offset="1" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="#344150" stroke-width="4"/>
  <path d="M70 112h118v42H112v52h58v42h-58v82c0 38 20 55 54 55h26v45h-31c-64 0-91-36-91-98z" fill="#f7fbff"/>
  <text x="250" y="314" font-family="Arial,Helvetica,sans-serif" font-size="200" font-weight="900" fill="url(#blue)" filter="url(#glow)" text-anchor="middle">2</text>
  <text x="254" y="400" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" letter-spacing="6" fill="#f7fbff" text-anchor="middle">SEC</text>
  <rect x="140" y="425" width="232" height="4" rx="2" fill="url(#blue)"/>
  <text x="256" y="461" font-family="monospace" font-size="16" letter-spacing="3" fill="#8f9cab" text-anchor="middle">JSQUARESEC</text>
</svg>