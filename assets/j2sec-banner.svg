<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">J2SEC Banner</title>
  <desc id="desc">J2SEC branded banner in black, gray, white and bright blue with digital camouflage accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.5" stop-color="#10151c"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a8ff"/>
      <stop offset="0.5" stop-color="#38c7ff"/>
      <stop offset="1" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="camo" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#0b0f14"/>
      <rect x="4" y="10" width="34" height="20" fill="#1f2833"/>
      <rect x="42" y="2" width="28" height="32" fill="#313c49"/>
      <rect x="73" y="15" width="38" height="18" fill="#101820"/>
      <rect x="18" y="45" width="44" height="26" fill="#151d26"/>
      <rect x="67" y="40" width="22" height="36" fill="#27313d"/>
      <rect x="94" y="55" width="24" height="22" fill="#11171e"/>
      <rect x="2" y="83" width="28" height="30" fill="#2b3540"/>
      <rect x="35" y="81" width="50" height="18" fill="#161e27"/>
      <rect x="86" y="88" width="30" height="28" fill="#222d39"/>
    </pattern>
  </defs>

  <rect width="1400" height="360" rx="26" fill="url(#bg)"/>
  <rect x="18" y="18" width="1364" height="324" rx="20" fill="none" stroke="#2d3947" stroke-width="2"/>
  <path d="M0 250 L260 210 L430 258 L640 205 L860 260 L1080 215 L1400 255 V360 H0 Z" fill="#0b1118" opacity="0.9"/>
  <rect x="0" y="0" width="360" height="360" fill="url(#camo)" opacity="0.24"/>
  <rect x="1040" y="0" width="360" height="360" fill="url(#camo)" opacity="0.24"/>

  <g opacity="0.75" stroke="#1aaeff" stroke-width="2">
    <path d="M70 92h150m-110 36h210M1110 82h220m-160 38h120"/>
    <path d="M90 284h240M1060 286h250"/>
  </g>

  <g transform="translate(700 178)" text-anchor="middle">
    <text y="-30" font-family="Arial,Helvetica,sans-serif" font-size="108" font-weight="900" letter-spacing="7" fill="#f7fbff">J<tspan fill="url(#blue)" filter="url(#glow)">2</tspan>SEC</text>
    <rect x="-245" y="7" width="490" height="3" rx="2" fill="url(#blue)"/>
    <text y="48" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#aab6c4">SYSTEMS • SECURITY • SOFTWARE</text>
    <text y="86" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="3" fill="#6f7d8b">JOSHUA JONES // JSQUARESEC</text>
  </g>

  <g font-family="monospace" font-size="14" fill="#38c7ff" opacity="0.8">
    <text x="54" y="52">// J2SEC_PROFILE</text>
    <text x="1170" y="52">STATUS: BUILDING</text>
    <text x="54" y="326">FATHER FIRST. ALWAYS.</text>
    <text x="1100" y="326">BUILD • SECURE • LEARN</text>
  </g>
</svg>